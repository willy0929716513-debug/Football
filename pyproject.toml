[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "football-predictor"
version = "1.0.0"
description = "Professional Elo-based NFL game prediction toolkit"
requires-python = ">=3.9"
readme = "README.md"
dependencies = [
    "numpy>=1.24",
]

[project.scripts]
nflpredict = "football_predictor.cli:main"

[tool.setuptools]
packages = ["football_predictor"]
