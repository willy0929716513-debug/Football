name: Update NFL predictions

on:
  schedule:
    # 10:00 UTC every day (= 18:00 Taiwan time) — catches each day's completed
    # games well after they've finished (even late Sunday/Monday-night games).
    - cron: "0 10 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh game data
        run: python3 scripts/fetch_data.py

      - name: Retrain models and export site data
        run: python3 -m football_predictor.cli export-site --start-season 2015

      - name: Run tests
        run: python3 -m pytest -q

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/nfl_games.csv ratings.json ratings_advanced.json docs/data.json docs/backtest_history.json
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "Auto-refresh predictions ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi
